services:
  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata-payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../
      dockerfile: PaymentService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres-payment;Port=5432;Database=paymentservice;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "5002:8080"
    depends_on:
      postgres-payment:
        condition: service_healthy

volumes:
  pgdata-payment:
