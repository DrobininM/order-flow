services:
  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ../
      dockerfile: OrderService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres-order;Port=5432;Database=orderservice;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__SecretKey=super-secret-key-for-development-at-least-32-chars!!
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "5001:8080"
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata-order:
